name: Release

  # A pushed tag v1.2.3 builds, tests and publishes the release with the installer (#40).
  # A pull request that changes the release process runs the same build without publishing,
  # so a broken release is found before the next tag.
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - src/installer/**
      - pom.xml

permissions:
  contents: write   # gh release create

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never stop a release halfway

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check that the tag matches pom.xml
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = mvn -B -q -ntp help:evaluate "-Dexpression=project.version" -DforceStdout
          Write-Host "Tag $tag, pom.xml $version"
          if ($version -like "*-SNAPSHOT") { throw "pom.xml has $version - tag the release commit, not a -SNAPSHOT one" }
          if ($tag -ne "v$version") { throw "Tag $tag does not match version $version in pom.xml" }

      - uses: ./.github/actions/install-ffmpeg

        # jpackage needs WiX for the .exe; installed only when the runner image does not have it
      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          if (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\light.exe") {
          Write-Host "WiX Toolset 3 is already installed"
          } else {
          choco install wixtoolset --no-progress -y
          }

      - name: Test and build the installer
        run: mvn -B -ntp -Pinstaller verify

      - name: Checksum of the installer
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem target/installer/*.exe) {
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$($exe.FullName).sha256" -Value "$hash *$($exe.Name)" -Encoding ascii -NoNewline
          Write-Host "$hash  $($exe.Name)"
          }

      - name: Keep the installer of a pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: target/installer
          retention-days: 7

      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $options = @("--title", "AudioFix $($tag.Substring(1))", "--generate-notes", "--verify-tag")
          if ($tag -match "-(rc|beta|alpha)") { $options += "--prerelease" }
          $files = (Get-ChildItem target/installer/*).FullName
          gh release create $tag @options @files

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports